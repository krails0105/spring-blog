<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Spring Blog">Spring Blog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header -->
<header>
    <nav>
        <a class="logo" th:href="@{/}">Spring Blog</a>
        <div class="nav-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/posts/new}">New Post</a>
        </div>
    </nav>
</header>

<!-- Main Content -->
<main layout:fragment="content">
    <p>Content goes here</p>
</main>

<!-- Footer -->
<footer>
    <p>&copy; 2026 Spring Blog. Built with Spring Boot &amp; Thymeleaf.</p>
</footer>

</body>
</html>
