<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>New Post</title>
</head>
<body>

<main layout:fragment="content">
    <h1>New Post</h1>

    <form th:action="@{/posts/new}" method="post">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" required></textarea>
        </div>
        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category.id">
                <option value="">-- Select --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">Category</option>
            </select>
        </div>
        <div class="form-group">
            <label for="tags">Tags (comma separated)</label>
            <input type="text" id="tags" name="tagInput" placeholder="Spring, JPA, Blog">
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{/posts}">Cancel</a>
    </form>
</main>

</body>
</html>
