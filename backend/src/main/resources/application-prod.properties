# Railway가 제공하는 개별 환경변수로 JDBC URL 구성
# DATABASE_URL은 postgres:// 형식이라 Spring Boot가 인식 못 할 수 있음
# PGHOST, PGPORT 등 개별 변수를 조합하면 확실하게 동작
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:blog}
spring.datasource.username=${PGUSER:}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Hibernate에게 PostgreSQL을 사용한다고 명시
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect